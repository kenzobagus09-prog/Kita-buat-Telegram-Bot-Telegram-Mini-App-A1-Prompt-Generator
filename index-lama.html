<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A1 Prompt Generator</title>

<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f4f7fb;color:#172033}
.app{max-width:700px;margin:auto;padding:20px}
.header,.card{background:white;border-radius:25px;padding:25px;margin-bottom:20px;box-shadow:0 8px 25px #dfe5ee}
.header{text-align:center}
h1{margin:0;font-size:32px}
h2{margin-top:0}
p{color:#687386}
.menu{display:flex;flex-direction:column;gap:12px}
button{
border:0;border-radius:18px;
padding:18px;
font-size:18px;
background:#eef3ff;
color:#172033;
cursor:pointer
}
button:active{transform:scale(.98)}
.generate{background:#172033;color:white;font-weight:bold}
textarea{
width:100%;
min-height:130px;
border:1px solid #d5dbe5;
border-radius:15px;
padding:15px;
font-size:16px;
margin:10px 0
}
.hidden{display:none}
.result{
background:#f4f7fb;
padding:15px;
border-radius:15px;
margin-top:15px;
white-space:pre-wrap;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<h1>✨ A1 Prompt Generator</h1>
<p>AI Prompt Generator</p>
</div>

<div class="card">
<h2>🛠️ MENU TOOL</h2>

<div class="menu">

<button onclick="promptFoto()">🖼️ Prompt Foto</button>

<button onclick="alert('Fitur Edit Foto siap digunakan.')">
✏️ Edit Foto
</button>

<button onclick="alert('Fitur Foto → Video siap digunakan.')">
🎬 Foto → Video
</button>

<button onclick="alert('Fitur Text → Video siap digunakan.')">
🎥 Text → Video
</button>

<button onclick="alert('Silakan upload foto referensi.')">
📷 Upload Foto Referensi
</button>

</div>
</div>

<div class="card">
<h2>🤖 Pilih AI</h2>

<div class="menu">
<button onclick="pilihAI('ChatGPT')">ChatGPT</button>
<button onclick="pilihAI('Gemini')">Gemini</button>
<button onclick="pilihAI('Google Flow')">Google Flow</button>
</div>

<p id="aiStatus">AI belum dipilih</p>
</div>

<div class="card hidden" id="fotoPanel">

<h2>🖼️ PROMPT FOTO</h2>

<p>Jelaskan foto yang ingin dibuat:</p>

<textarea id="fotoInput"
placeholder="Contoh: seorang pria berdiri di depan mobil sport pada sore hari..."></textarea>

<button class="generate" onclick="generatePrompt()">
⚡ GENERATE PROMPT
</button>

<div id="hasil" class="result hidden"></div>

<br>

<button onclick="copyPrompt()">
📋 Copy Prompt
</button>

</div>

</div>

<script>

let selectedAI="ChatGPT";
let hasilPrompt="";

function promptFoto(){
document.getElementById("fotoPanel").classList.remove("hidden");
document.getElementById("fotoPanel").scrollIntoView({
behavior:"smooth"
});
}

function pilihAI(ai){
selectedAI=ai;
document.getElementById("aiStatus").innerText=
"AI dipilih: "+ai;
}

function generatePrompt(){

let input=document.getElementById("fotoInput").value.trim();

if(!input){
alert("Silakan isi deskripsi foto terlebih dahulu.");
return;
}

hasilPrompt=
"Create a high-quality photorealistic image.\n\n"+
"Subject: "+input+"\n\n"+
"Style: photorealistic, realistic skin texture, natural lighting, "+
"accurate proportions, detailed facial features, professional photography.\n\n"+
"Composition: cinematic composition, sharp focus, realistic depth of field.\n\n"+
"AI Target: "+selectedAI;

let box=document.getElementById("hasil");

box.innerText=hasilPrompt;
box.classList.remove("hidden");
}

function copyPrompt(){

if(!hasilPrompt){
alert("Generate prompt terlebih dahulu.");
return;
}

navigator.clipboard.writeText(hasilPrompt)
.then(function(){
alert("Prompt berhasil disalin.");
})
.catch(function(){
alert("Prompt sudah dibuat. Silakan tekan lama pada teks untuk menyalin.");
});

}

</script>

</body>
</html>
