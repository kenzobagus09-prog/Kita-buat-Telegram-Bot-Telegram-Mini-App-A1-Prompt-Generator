<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1 Prompt Generator</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #172033;
    }

    .app {
      max-width: 480px;
      margin: auto;
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 8px 0 0;
      color: #687386;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 15px;
      font-size: 16px;
      cursor: pointer;
      background: #eef3ff;
      color: #172033;
    }

    .generate {
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .status {
      text-align: center;
      font-size: 13px;
      color: #687386;
      margin-top: 18px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <h1>✨ A1 Prompt Generator</h1>
      <p>AI Prompt Generator</p>
    </div>

    <div class="card">
      <h2>🛠️ MENU TOOL</h2>

      <div class="menu">
        <button>🖼️ Prompt Foto</button>
        <button>✏️ Edit Foto</button>
        <button>🎬 Foto → Video</button>
        <button>🎥 Text → Video</button>
        <button>📷 Upload Foto Referensi</button>
      </div>
    </div>

    <div class="card">
      <h2>🤖 Pilih AI</h2>

      <div class="menu">
        <button>ChatGPT</button>
        <button>Gemini</button>
        <button>Google Flow</button>
      </div>
    </div>

    <div class="card">
      <button class="generate" onclick="generatePrompt()">
        ⚡ GENERATE PROMPT
      </button>
    </div>

    <div class="status" id="status">
      A1 Prompt Generator • Versi 1.0
    </div>

  </div>

  <script>
    function generatePrompt() {
      document.getElementById("status").innerText =
        "✅ Generator siap digunakan!";
    }
  </script>

</body>
</html>
