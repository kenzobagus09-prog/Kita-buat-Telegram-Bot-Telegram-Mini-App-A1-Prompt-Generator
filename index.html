<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Universal Prompt AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:18px;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
}

.box{
  max-width:700px;
  margin:auto;
  background:#1b1b1b;
  padding:20px;
  border-radius:18px;
  box-shadow:0 4px 20px #0008;
}

h1{
  text-align:center;
  font-size:25px;
  margin:5px 0 8px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

textarea{
  width:100%;
  min-height:150px;
  padding:14px;
  border-radius:12px;
  border:1px solid #444;
  background:#292929;
  color:#fff;
  font-size:16px;
  resize:vertical;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.btn-create{
  background:#fff;
  color:#111;
}

.btn-chatgpt{
  background:#19a463;
  color:#fff;
}

.result{
  margin-top:18px;
  padding:15px;
  min-height:180px;
  background:#0d0d0d;
  border:1px solid #444;
  border-radius:12px;
  white-space:pre-wrap;
  line-height:1.5;
}

.status{
  text-align:center;
  color:#20c65a;
  margin-top:12px;
  min-height:22px;
}

.info{
  text-align:center;
  color:#888;
  font-size:13px;
  margin-top:15px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="box">

<h1>🤖 UNIVERSAL PROMPT AI</h1>

<div class="subtitle">
Pembuat Prompt Profesional untuk ChatGPT
</div>

<label for="input">
Tulis perintah Anda:
</label>

<textarea
id="input"
placeholder="Contoh:
Buat prompt video promosi obat kambing, durasi 24 detik, rasio 9:16, bahasa Indonesia."
></textarea>

<button
class="btn-create"
onclick="generate()">
⚡ BUAT PROMPT
</button>

<div
id="result"
class="result">
Prompt hasil akan muncul di sini...
</div>

<button
class="btn-chatgpt"
onclick="sendToChatGPT()">
🚀 KIRIM KE CHATGPT
</button>

<div
id="status"
class="status">
</div>

<div class="info">
Setelah tombol diklik, prompt akan otomatis disalin.
<br>
ChatGPT akan dibuka.
<br>
Di ChatGPT tekan kotak pesan → Tempel → Kirim.
</div>

</div>


<script>

let generatedPrompt = "";


/* =========================
   MEMBUAT PROMPT
========================= */

function generate(){

  const input =
    document.getElementById("input").value.trim();

  if(!input){

    alert("Tulis perintah terlebih dahulu.");

    return;
  }


  const lower =
    input.toLowerCase();


  /* DURASI */

  const durationMatch =
    input.match(
      /\b\d+\s*(?:detik|second|seconds)\b/i
    );

  const duration =
    durationMatch
    ? durationMatch[0]
    : "sesuai permintaan";


  /* RASIO */

  const ratioMatch =
    input.match(
      /\b\d+\s*[:x]\s*\d+\b/i
    );

  const ratio =
    ratioMatch
    ? ratioMatch[0]
    : "sesuai permintaan";


  /* JENIS PROMPT */

  let type = "UMUM";

  if(
    /video|vidio|film|promosi video|iklan/.test(lower)
  ){

    type = "VIDEO";

  }
  else if(
    /gambar|foto|image|poster|desain/.test(lower)
  ){

    type = "VISUAL";

  }


  /* DIALOG */

  const hasDialog =
    /dialog|percakapan|ucapan|bicara|narasi|voice over/.test(lower);


  /* PROMPT FINAL */

  generatedPrompt =

`Anda adalah Prompt Engineer profesional untuk ChatGPT.

TUGAS:
Ubah perintah pengguna di bawah ini menjadi prompt yang lengkap, jelas, terstruktur, dan siap digunakan.

PERINTAH ASLI PENGGUNA:
${input}

JENIS PEKERJAAN:
${type}

ANALISIS DAN PENGEMBANGAN:

1. TUJUAN
Tentukan tujuan utama pengguna dan jangan mengubah maksudnya.

2. SUBJEK / KARAKTER
Pertahankan semua karakter, model, penampilan, pakaian, dan ciri penting yang disebutkan.

3. PRODUK / OBJEK
Pertahankan nama produk, bentuk, ukuran relatif, warna, tulisan, label, fungsi, dan detail penting lainnya.

4. AKSI
Jelaskan tindakan secara jelas dan berurutan.

5. LOKASI DAN LATAR
Tentukan lingkungan, tempat, suasana, dan waktu yang paling sesuai apabila belum dijelaskan.

6. GAYA VISUAL
Gunakan tampilan realistis, natural, profesional, dan berkualitas tinggi kecuali pengguna meminta gaya lain.

7. KAMERA
Tentukan shot, sudut kamera, komposisi, fokus, dan gerakan kamera yang sesuai.

8. PENCAHAYAAN
Gunakan pencahayaan yang natural dan konsisten dengan suasana adegan.

9. DIALOG / AUDIO
${
hasDialog
? "Pertahankan dialog atau voice-over yang diminta dan gunakan bahasa Indonesia."
: "Jangan menambahkan dialog atau audio yang tidak diminta."
}

10. DURASI
${duration}

11. RASIO GAMBAR
${ratio}

12. REFERENSI
Jika pengguna menyediakan gambar referensi, gunakan gambar tersebut sebagai acuan dan jangan mengubah elemen penting tanpa perintah.

ATURAN WAJIB:

- Jangan mengubah tujuan pengguna.
- Jangan menghilangkan detail penting.
- Jangan menambahkan orang, produk, logo, teks, atau kejadian yang tidak diminta.
- Jika ada informasi yang belum lengkap, lengkapi dengan asumsi yang wajar.
- Untuk video, buat adegan yang jelas dan terstruktur.
- Jaga kontinuitas karakter, pakaian, produk, lokasi, pencahayaan, dan kamera.
- Gunakan bahasa Indonesia kecuali pengguna meminta bahasa lain.
- Jangan memberikan teori yang tidak diperlukan.
- Hasil harus langsung siap digunakan di ChatGPT.
- Jika ada instruksi yang saling bertentangan, prioritaskan instruksi pengguna yang paling spesifik.

FORMAT HASIL:

1. Tujuan
2. Subjek / karakter
3. Produk / objek
4. Aksi
5. Lokasi dan latar
6. Visual dan gaya
7. Kamera dan komposisi
8. Pencahayaan dan mood
9. Dialog / audio
10. Durasi dan rasio
11. Kontinuitas
12. Negative constraints
13. PROMPT FINAL

KERJAKAN LANGSUNG.
Jangan memberikan pembukaan panjang.`;


  document.getElementById("result").textContent =
    generatedPrompt;


  document.getElementById("status").textContent =
    "✅ Prompt berhasil dibuat.";

}


/* =========================
   SALIN OTOMATIS
========================= */

async function copyPrompt(){

  if(!generatedPrompt){

    return false;

  }


  try{

    await navigator.clipboard.writeText(
      generatedPrompt
    );

    return true;

  }
  catch(error){

    try{

      const area =
        document.createElement("textarea");

      area.value =
        generatedPrompt;

      document.body.appendChild(area);

      area.select();

      document.execCommand("copy");

      document.body.removeChild(area);

      return true;

    }
    catch(e){

      return false;

    }

  }

}


/* =========================
   KIRIM KE CHATGPT
========================= */

async function sendToChatGPT(){

  if(!generatedPrompt){

    alert(
      "Buat prompt terlebih dahulu."
    );

    return;

  }


  /* Salin prompt */

  const copied =
    await copyPrompt();


  if(copied){

    document.getElementById("status").textContent =
      "✅ Prompt sudah disalin. Membuka ChatGPT...";

  }
  else{

    document.getElementById("status").textContent =
      "⚠️ Prompt belum berhasil disalin.";

  }


  /* Buka ChatGPT */

  setTimeout(function(){

    window.open(
      "https://chatgpt.com/",
      "_blank"
    );

  },500);

}

</script>

</body>
</html>
